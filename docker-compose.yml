# version: '3.8'

services:
  web:
    build: .
    volumes:
      - .:/app
      - ./localhost.pem:/app/localhost.pem
      - ./localhost-key.pem:/app/localhost-key.pem
    ports:
      - "443:443"
    depends_on:
      - db
    environment:
      - DEBUG=0
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,[::1]
      - DJANGO_SETTINGS_MODULE=backend.settings
      - PYTHONPATH=/app
    networks:
      - basta-network
    entrypoint: ["/bin/bash", "/app/scripts/entrypoint.sh"]

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      # Credentials come from .env (never committed) - same keys Django reads via python-decouple
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - basta-network

volumes:
  postgres_data:

networks:
  basta-network:
    driver: bridge